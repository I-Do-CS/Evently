name: Evently
services:
  evently.api:
    container_name: Evently.API
    build:
      context: .
      dockerfile: API/Evently.API/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "5000"
    ports:
      - "5000:5000"
    depends_on:
      - evently.database

  evently.database:
    container_name: Evently.Database
    image: postgres:18.6
    environment:
      POSTGRES_DB: evently
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_volume:/var/lib/postgresql

volumes:
  db_volume:
