name: Evently
services:
  evently.api:
    container_name: Evently.API
    build:
      context: .
      dockerfile: API/Evently.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:5000"
    depends_on:
      evently.database:
        condition: service_healthy

  evently.database:
    container_name: Evently.Database
    image: postgres:18.6
    environment:
      POSTGRES_DB: evently
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evently"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  db_volume:
